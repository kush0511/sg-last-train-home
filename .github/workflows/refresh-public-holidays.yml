name: Refresh public holidays

on:
  # MOM normally publishes the next calendar well before June.
  schedule:
    - cron: "17 1 1 6 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:refresh:public-holidays
      - run: npm run validate:data
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-public-holidays
          delete-branch: true
          commit-message: "data: refresh official public holidays"
          title: "data: refresh official public holidays"
          body: "Automated refresh from the Ministry of Manpower dataset on data.gov.sg. Review the diff before merging."
